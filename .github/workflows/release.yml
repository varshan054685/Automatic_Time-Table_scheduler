name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-service/requirements.txt'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r python-service/requirements.txt
          pip install pyinstaller

      - name: Run Tests & Type Checks
        run: |
          npm run check
          npm run test

      - name: Build Application & Solver
        run: |
          npm run build
          npm run build:electron
          npm run build:solver

      - name: Build Desktop Installer & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
